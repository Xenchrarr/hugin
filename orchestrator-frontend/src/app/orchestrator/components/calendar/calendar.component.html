<div class="page-header">
    <h2>Calendar</h2>
    <button mat-flat-button color="primary" (click)="addSource()">
        <mat-icon>add</mat-icon> Add Source
    </button>
</div>

<!-- Sources table -->
<mat-table [dataSource]="sources" class="sources-table">
    <ng-container matColumnDef="name">
        <mat-header-cell *matHeaderCellDef>Name</mat-header-cell>
        <mat-cell *matCellDef="let s">{{ s.name }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="url">
        <mat-header-cell *matHeaderCellDef>iCal URL</mat-header-cell>
        <mat-cell *matCellDef="let s" class="url-cell">{{ s.url }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="enabled">
        <mat-header-cell *matHeaderCellDef>Enabled</mat-header-cell>
        <mat-cell *matCellDef="let s">
            <mat-slide-toggle [(ngModel)]="s.enabled" (change)="toggleEnabled(s)"></mat-slide-toggle>
        </mat-cell>
    </ng-container>

    <ng-container matColumnDef="actions">
        <mat-header-cell *matHeaderCellDef></mat-header-cell>
        <mat-cell *matCellDef="let s" class="actions-cell">
            <button mat-icon-button (click)="editSource(s)" aria-label="Edit">
                <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteSource(s)" aria-label="Delete">
                <mat-icon>delete</mat-icon>
            </button>
        </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
</mat-table>

<!-- View toggle + calendar -->
<div class="calendar-header">
    <h3>Events</h3>
    <mat-button-toggle-group [(ngModel)]="view">
        <mat-button-toggle value="agenda">Agenda</mat-button-toggle>
        <mat-button-toggle value="week">Week</mat-button-toggle>
    </mat-button-toggle-group>
</div>

<div *ngIf="loading" class="loading">Loading events…</div>

<app-agenda-view *ngIf="!loading && view === 'agenda'" [events]="events"></app-agenda-view>
<app-week-view   *ngIf="!loading && view === 'week'"   [events]="events"></app-week-view>
