<h1>Reminders</h1>

<p>
    <mat-button-toggle-group [value]="statusFilter" (change)="onStatusFilterChange($event.value)">
        <mat-button-toggle value="active">Active</mat-button-toggle>
        <mat-button-toggle value="snoozed">Snoozed</mat-button-toggle>
        <mat-button-toggle value="completed">Completed</mat-button-toggle>
        <mat-button-toggle value="dismissed">Dismissed</mat-button-toggle>
        <mat-button-toggle value="">All</mat-button-toggle>
    </mat-button-toggle-group>
</p>

<p>
    <button mat-stroked-button (click)="loadReminders()">Reload</button>
    <button mat-flat-button color="primary" (click)="addReminder()">Add reminder</button>
</p>

<div class="mat-elevation-z8">
    <table mat-table [dataSource]="reminders" class="mat-elevation-z8">

        <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef>Title</th>
            <td mat-cell *matCellDef="let row">{{ row.title }}</td>
        </ng-container>

        <ng-container matColumnDef="due_at">
            <th mat-header-cell *matHeaderCellDef>Due</th>
            <td mat-cell *matCellDef="let row">{{ row.due_at | date:'medium' }}</td>
        </ng-container>

        <ng-container matColumnDef="recurrence">
            <th mat-header-cell *matHeaderCellDef>Recurrence</th>
            <td mat-cell *matCellDef="let row">{{ row.recurrence || 'One-time' }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let row">
                <span class="status-badge" [class]="'status-' + row.status">{{ row.status }}</span>
            </td>
        </ng-container>

        <ng-container matColumnDef="recipients">
            <th mat-header-cell *matHeaderCellDef>Recipients</th>
            <td mat-cell *matCellDef="let row">
                <mat-chip-set *ngIf="row.recipient_ids?.length">
                    <mat-chip *ngFor="let label of getRecipientLabels(row)">{{ label }}</mat-chip>
                </mat-chip-set>
                <span *ngIf="!row.recipient_ids?.length" class="default-label">all</span>
            </td>
        </ng-container>

        <ng-container matColumnDef="created_by">
            <th mat-header-cell *matHeaderCellDef>Source</th>
            <td mat-cell *matCellDef="let row">{{ row.created_by }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let row" class="actions-cell">
                <button mat-stroked-button (click)="editReminder(row); $event.stopPropagation()"
                        *ngIf="row.status === 'active' || row.status === 'snoozed'">Edit</button>
                <button mat-stroked-button (click)="snoozeReminder(row); $event.stopPropagation()"
                        *ngIf="row.status === 'active'">Snooze</button>
                <button mat-stroked-button (click)="dismissReminder(row); $event.stopPropagation()"
                        *ngIf="row.status === 'active' || row.status === 'snoozed'">Dismiss</button>
                <button mat-stroked-button color="warn" (click)="confirmDeleteReminder(row); $event.stopPropagation()">Delete</button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>

<div *ngIf="reminders.length === 0" class="empty-state">
    <p>No reminders found. Click "Add reminder" to create one.</p>
</div>
