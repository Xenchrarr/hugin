<div class="login-wrapper">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Sign in</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="submit()" #loginForm="ngForm">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input matInput [(ngModel)]="username" name="username" autocomplete="username" required />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" [(ngModel)]="password" name="password"
                 autocomplete="current-password" required />
        </mat-form-field>

        @if (error()) {
          <p class="error-msg">{{ error() }}</p>
        }

        <button mat-raised-button color="primary" type="submit"
                [disabled]="loading() || !username || !password" class="full-width">
          {{ loading() ? 'Signing in…' : 'Sign in' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
